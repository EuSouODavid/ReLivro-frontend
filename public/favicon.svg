<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="30" fill="url(#bg)"/>

  <!-- soft shadow under the book -->
  <ellipse cx="60" cy="85" rx="36" ry="5.5" fill="#02543f" opacity="0.25" filter="url(#soft-shadow)"/>

  <!-- open book -->
  <g fill="#ffffff">
    <path d="M60,48 C46,41 31,41 20,46 L20,84 C31,79 46,79 60,86 Z"/>
    <path d="M60,48 C74,41 89,41 100,46 L100,84 C89,79 74,79 60,86 Z"/>
  </g>
  <rect x="58.5" y="46" width="3" height="42" rx="1.5" fill="#047857"/>
</svg>
